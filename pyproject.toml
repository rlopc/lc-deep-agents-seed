[project]
name = "lc-deep-agents-seed"
version = "0.1.0"
description = "A production-shaped starting point for LangChain deep agents."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "deepagents>=0.7.7",
    # No source file imports this one: agent.py names the provider in a model string,
    # which init_chat_model resolves to langchain_anthropic.ChatAnthropic at runtime.
    # A dependency with no import to point at still has to be declared.
    "langchain-anthropic>=1.6.0",
    "langchain-core>=1.6.0",
    "langgraph>=1.2.11",
]

[project.scripts]
greet = "lc_deep_agents_seed.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lc_deep_agents_seed"]

[tool.ruff]
# Ruff's own default, made explicit because .editorconfig mirrors it for editors.
line-length = 88

[tool.ruff.lint]
# Errors, pyflakes, import order, naming, modern syntax, bugbears, simplifications.
# There is no `target-version`: ruff infers it from `requires-python`.
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra prints the reason behind every non-passing outcome, so a skip is not just a
# number in the tally; --strict-markers and --strict-config turn a typo in a marker
# or a config key into an error instead of something silently ignored.
addopts = "-q -ra --strict-markers --strict-config"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

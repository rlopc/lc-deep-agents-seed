[project]
name = "lc-deep-agents-seed"
version = "0.1.0"
description = "A production-shaped starting point for LangChain deep agents."
readme = "README.md"
requires-python = ">=3.14,<4.0"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "deepagents>=0.7.7",
]

[project.scripts]
greet = "lc_deep_agents_seed.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lc_deep_agents_seed"]

[tool.ruff.lint]
# Errors, pyflakes, import order, naming, modern syntax, bugbears, simplifications.
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
